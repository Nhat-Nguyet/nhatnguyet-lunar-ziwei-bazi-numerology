<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>@nhatnguyet/widgets examples</title>
<style>
  :root{color-scheme:light dark;--nen:#f4f6f5;--chu:#1b1f1e}
  @media (prefers-color-scheme:dark){:root{--nen:#10201e;--chu:#ecf1ef}}
  body{margin:0;padding:16px;background:var(--nen);color:var(--chu);font:15px/1.5 system-ui,sans-serif}
  h1{font-size:1.15rem;margin:0 0 4px}
  p{margin:0 0 16px;max-width:60ch}
  form{display:flex;flex-wrap:wrap;gap:8px 14px;margin:0 0 18px;font-size:.9rem}
  .luoi{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--rong,320px)),1fr));align-items:start}
  code{font-size:.85em;overflow-wrap:anywhere}
  p,form{overflow-wrap:anywhere}
</style>
</head>
<body>
<h1>@nhatnguyet/widgets</h1>
<p>Five web components that compute the Vietnamese lunar calendar in the browser. No server, no tracking. Query string: <code>?lang=vi|en|zh&amp;theme=light|dark|auto&amp;rong=300&amp;date=2026-11-19&amp;country=VN</code>.</p>
<form id="chinh">
  <label>lang <select name="lang"><option>vi</option><option>en</option><option>zh</option></select></label>
  <label>theme <select name="theme"><option>light</option><option>dark</option><option>auto</option></select></label>
  <label>width <select name="rong"><option>280</option><option>300</option><option selected>360</option><option>600</option><option>1280</option></select></label>
  <label>country <select name="country"><option>VN</option><option>CN</option><option>KR</option></select></label>
  <label>accent <input name="accent" type="color" value="#b5402f"></label>
</form>
<div class="luoi" id="luoi"></div>
<script type="module">
  // Dùng bản dựng một tệp, như khi nạp từ CDN.
  import "../dist/nn-widgets.js";
  const q = new URLSearchParams(location.search);
  const THE = ["nn-lich-hom-nay", "nn-gio-hoang-dao", "nn-dem-nguoc-tet", "nn-lich-thang", "nn-doi-lich"];
  const form = document.getElementById("chinh");
  for (const k of ["lang", "theme", "rong", "country"]) if (q.get(k)) form.elements[k].value = q.get(k);
  if (q.get("accent")) form.elements.accent.value = q.get("accent");
  const luoi = document.getElementById("luoi");
  function ve() {
    const f = form.elements;
    luoi.style.setProperty("--rong", f.rong.value + "px");
    luoi.style.maxWidth = q.get("chi") ? f.rong.value + "px" : "";
    luoi.innerHTML = "";
    for (const t of q.get("chi") ? [q.get("chi")] : THE) {
      const el = document.createElement(t);
      el.setAttribute("lang", f.lang.value);
      el.setAttribute("theme", f.theme.value);
      el.setAttribute("country", f.country.value);
      if (f.accent.value !== "#b5402f") el.setAttribute("accent", f.accent.value);
      if (q.get("date")) el.setAttribute("date", q.get("date"));
      luoi.appendChild(el);
    }
  }
  form.addEventListener("change", ve);
  ve();
</script>
</body>
</html>
