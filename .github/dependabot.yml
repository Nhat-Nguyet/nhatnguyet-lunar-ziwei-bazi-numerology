# Dependabot: weekly update PRs for the GitHub Actions, the npm workspace in
# js/ and the Python package in python/. Security alerts and security update
# PRs are separate and cover every dependency, runtime ones included.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Version-update PRs only for development dependencies (TypeScript, typedoc,
  # test tools). The few runtime dependencies (the MCP SDK and zod of
  # @nhatnguyet/mcp) are pinned on purpose and bumped by hand after testing.
  - package-ecosystem: npm
    directory: /js
    schedule:
      interval: weekly
    allow:
      - dependency-type: development
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  # The Python package has no dependencies; this watches the build backend
  # declared in pyproject.toml.
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
