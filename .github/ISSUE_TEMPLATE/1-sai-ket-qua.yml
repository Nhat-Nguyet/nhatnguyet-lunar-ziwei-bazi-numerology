name: Wrong calculation
description: A date, star, pillar or number differs from what a source says. Báo kết quả tính sai. 报告计算错误。
title: "[calc] "
labels: ["bug", "calculation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! A report with a birth date and time, the result you got, the result you expected and a **source** can be checked and fixed quickly.
        Viết tiếng Việt hay 中文 cũng được. 也可以用中文填写。
  - type: dropdown
    id: mon
    attributes:
      label: Area
      options:
        - Lunar calendar, solar terms, can chi (am-lich)
        - Zi Wei Dou Shu (tu-vi)
        - BaZi (bat-tu)
        - Numerology (than-so-hoc)
        - Festivals (le-hoi)
        - Datasets (Hugging Face, nhatnguyet.org/du-lieu)
    validations:
      required: true
  - type: dropdown
    id: ban
    attributes:
      label: Where did you see it?
      multiple: true
      options:
        - npm package (TypeScript, JavaScript)
        - PyPI package (Python)
        - nhatnguyet.org or the Nhat Nguyet app
        - a dataset
        - my own port
    validations:
      required: true
  - type: input
    id: phien-ban
    attributes:
      label: Package version
      description: "`npm ls @nhatnguyet/tu-vi` or `pip show nhatnguyet`"
      placeholder: "@nhatnguyet/tu-vi 0.1.0"
  - type: textarea
    id: dau-vao
    attributes:
      label: Input
      description: Birth date (Gregorian or lunar, leap month or not), time and time zone, gender, year viewed. For the calendar, the date and the country.
      placeholder: |
        Gregorian 19/9/1990, 20:00 Vietnam time (UTC+7), male, year viewed 2026
    validations:
      required: true
  - type: textarea
    id: ma
    attributes:
      label: Code you ran
      description: Leave empty if you saw the result on the website, the app or in a dataset.
      render: ts
      placeholder: |
        import { lapLaSoTuVi } from "@nhatnguyet/tu-vi";
        lapLaSoTuVi("", "Nam", 19, 9, 1990, 10).tenCuc;
  - type: textarea
    id: nhan-duoc
    attributes:
      label: Result you got
    validations:
      required: true
  - type: textarea
    id: mong-doi
    attributes:
      label: Result you expected
    validations:
      required: true
  - type: textarea
    id: can-cu
    attributes:
      label: Source for the expected result
      description: Book, chapter and the original sentence; or astronomical data (NASA, IMCCE, USNO) with a link. Without a source the report is treated as a question until one is found.
      placeholder: |
        Tử Vi Đẩu Số Toàn Thư, chương ..., câu "..."
        or: NASA new moon table, https://...
  - type: checkboxes
    id: kiem
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues.
          required: true
        - label: I did not edit `ca-kiem/*.json` (test cases are generated by the reference engine).
          required: true
